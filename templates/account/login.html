{% extends "shared/base.html" %}

{% block title %}Log in — AgriScheme AI{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 px-4">
  <div class="bg-white p-8 rounded-2xl shadow-sm border border-neutral-200">
    <h2 class="text-2xl font-bold text-neutral-900 mb-6 text-center">Welcome back</h2>
    
    <form method="post" class="space-y-4">
      {% csrf_token %}
      
      {% if form.non_field_errors %}
        <div class="p-3 bg-red-50 text-red-700 rounded-lg text-sm border border-red-200">
          {{ form.non_field_errors.0 }}
        </div>
      {% endif %}

      <div>
        <label for="{{ form.username.id_for_label }}" class="block text-sm font-medium text-neutral-700 mb-1">Email address</label>
        {{ form.username }}
      </div>

      <div>
        <label for="{{ form.password.id_for_label }}" class="block text-sm font-medium text-neutral-700 mb-1">Password</label>
        {{ form.password }}
      </div>

      <button type="submit" class="w-full bg-brand-600 text-white py-2.5 rounded-lg font-medium hover:bg-brand-700 transition">
        Log in
      </button>
    </form>

    <p class="mt-6 text-center text-sm text-neutral-600">
      Don't have an account? <a href="{% url 'signup' %}" class="text-brand-600 font-medium hover:underline">Sign up</a>
    </p>
  </div>
</div>
{% endblock %}
