{% extends "shared/base.html" %}

{% block title %}Browse Schemes — AgriScheme AI{% endblock %}

{% block content %}
<div class="max-w-6xl mx-auto px-4 py-10">
  <div class="mb-8">
    <h1 class="text-3xl font-bold text-neutral-900">Browse Government Schemes</h1>
    <p class="mt-2 text-neutral-600">Search across 848 agricultural schemes and find the ones relevant to you.</p>
  </div>

  <!-- Search Bar (HTMX) -->
  <div class="mb-8 relative max-w-2xl">
    <input 
      type="text" 
      name="q" 
      value="{{ query }}"
      placeholder="Search by name, department, or keyword (e.g., 'fisheries', 'Gujarat', 'tractor')..." 
      class="w-full px-5 py-3 border border-neutral-300 rounded-xl shadow-sm focus:ring-2 focus:ring-brand-500 focus:border-brand-500 outline-none transition"
      hx-get="{% url 'scheme_list' %}"
      hx-trigger="keyup changed delay:500ms, search"
      hx-target="#scheme-results"
      hx-swap="innerHTML"
    >
    <!-- Loading indicator -->
    <div class="htmx-indicator absolute right-4 top-3.5 text-brand-600">
      <svg class="animate-spin h-5 w-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
    </div>
  </div>

  <!-- Results Container -->
  <div id="scheme-results">
    {% include "schemes/partials/scheme_grid.html" %}
  </div>
</div>

<!-- HTMX Script -->
<script src="https://unpkg.com/htmx.org@1.9.10"></script>
{% endblock %}
